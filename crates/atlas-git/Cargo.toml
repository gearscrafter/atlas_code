[package]
name = "atlas-git"
description = "Git operations for Atlas Code"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
atlas-editor = { path = "../atlas-editor" }
base64 = "0.23.1"
git2 = { version = "0.21.0", default-features = false }
gix = { version = "0.89.0", default-features = false, features = ["sha1", "progress-tree", "blocking-network-client", "blocking-http-transport-reqwest-rust-tls", "worktree-mutation", "status", "index", "credentials"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
