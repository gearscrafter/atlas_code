[package]
name = "atlas-script"
description = "Atlas Code scripting (Lua): describe and animate VR scenes (no XR or Vulkan)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Lua 5.4 compiled from the bundled sources, so nothing installed is needed.
mlua = { version = "0.10", features = ["lua54", "vendored"] }
